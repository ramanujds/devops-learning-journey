apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.platform.example.com
spec:
  group: platform.example.com
  scope: Namespaced
  names:
    kind: WebApp
    plural: webapps
    shortNames: [wa]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}                      # lets the controller write .status
      additionalPrinterColumns:
        - {name: Image,   type: string,  jsonPath: .spec.image}
        - {name: Desired, type: integer, jsonPath: .spec.replicas}
        - {name: Ready,   type: integer, jsonPath: .status.readyReplicas}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:    {type: string}
                replicas: {type: integer, default: 1}
                port:     {type: integer, default: 8080}
                env:                    # same shape as a container's env
                  type: array
                  items:
                    type: object
                    properties:
                      name:  {type: string}
                      value: {type: string}
            status:
              type: object
              properties:
                readyReplicas: {type: integer}
