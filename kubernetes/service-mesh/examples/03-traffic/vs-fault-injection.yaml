# Step 5: chaos testing - break things on purpose, without touching the app.
# Every request is delayed by 2s, then 50% of them are aborted with a 503.
# Both faults are generated by the CALLER's sidecar; backend never sees the 503s.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backend
  namespace: mesh-demo
spec:
  hosts: ["backend"]
  http:
    - fault:
        delay:
          percentage: { value: 100 }
          fixedDelay: 2s
        abort:
          percentage: { value: 50 }
          httpStatus: 503
      route:
        - destination: { host: backend, subset: v1 }
