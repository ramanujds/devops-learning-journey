apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: part-order-app-kafka
  labels:
    app: kafka
spec:
  # headless: gives the StatefulSet pod a stable DNS name (kafka-0.kafka),
  # which is what the broker advertises to clients. "kafka" on its own
  # resolves to the (ready) broker pod IP, so it works as the bootstrap address.
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: client
    - name: controller
      port: 9093
      targetPort: controller
