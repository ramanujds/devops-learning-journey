# Single Kafka broker in KRaft mode (no ZooKeeper): this one process is both
# the broker (stores/serves messages) and the controller (cluster metadata).
# Good enough for dev; see NOTES.md "Next steps" for a real multi-broker setup.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: part-order-app-kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Without this, Kubernetes injects KAFKA_SERVICE_HOST / KAFKA_PORT-style
      # env vars for any Service named "kafka", and the apache/kafka image
      # turns every KAFKA_* env var into a broker config property.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000            # apache/kafka runs as uid 1000 (appuser); lets it write to the PVC
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Any KAFKA_* env var becomes a server.properties entry
            # (KAFKA_LOG_DIRS -> log.dirs). Once you set one, the image's
            # built-in defaults are dropped, so the full KRaft config is here.
            - name: CLUSTER_ID
              value: "part-order-kafka-dev01"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # The address clients are told to reconnect to after bootstrapping:
            # kafka-0.kafka.part-order-app-kafka.svc.cluster.local, via the
            # headless Service. Fully qualified (not just kafka-0.kafka) so
            # clients in OTHER namespaces - e.g. the KEDA operator in "keda",
            # see k8s-with-keda/ - can resolve it too.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka.$(POD_NAMESPACE).svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            # Internal topics default to replication factor 3 - impossible
            # with one broker, so consumer groups would never work without these
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
