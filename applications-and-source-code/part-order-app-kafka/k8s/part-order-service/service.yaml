apiVersion: v1
kind: Service
metadata:
  name: part-order-service
  namespace: part-order-app-kafka
  labels:
    app: part-order-service
spec:
  # NodePort so POST /api/orders is reachable from your laptop
  # (30080/30081 are taken by the k8s/ and k8s-with-mysql/ stacks)
  type: NodePort
  selector:
    app: part-order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30085
