apiVersion: apps/v1
kind: Deployment
metadata:
  name: part-order-service
  namespace: part-order-app-kafka
  labels:
    app: part-order-service
spec:
  # single replica: H2 is in-memory and per-pod, so a second replica would
  # have its own disconnected copy of the data
  replicas: 1
  selector:
    matchLabels:
      app: part-order-service
  template:
    metadata:
      labels:
        app: part-order-service
    spec:
      initContainers:
        # headless-Service DNS only returns *ready* pods, so this waits until
        # the broker passes its readinessProbe
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done
      containers:
        - name: part-order-service
          image: ram1uj/part-order-service-kafka:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: part-order-service-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
