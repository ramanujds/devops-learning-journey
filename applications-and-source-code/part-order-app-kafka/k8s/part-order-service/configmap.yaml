apiVersion: v1
kind: ConfigMap
metadata:
  name: part-order-service-config
  namespace: part-order-app-kafka
data:
  # read by spring.kafka.bootstrap-servers in application.yml. Only used for
  # the first connection - after that the client talks to whatever the broker
  # advertises (kafka-0.kafka.part-order-app-kafka.svc.cluster.local:9092).
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
