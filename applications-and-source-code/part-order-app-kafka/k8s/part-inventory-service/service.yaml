apiVersion: v1
kind: Service
metadata:
  name: part-inventory-service
  namespace: part-order-app-kafka
  labels:
    app: part-inventory-service
spec:
  # Nothing calls this over HTTP anymore - orders arrive through Kafka.
  # It only exists so you can port-forward and watch GET /api/parts.
  type: ClusterIP
  selector:
    app: part-inventory-service
  ports:
    - name: http
      port: 8080
      targetPort: http
