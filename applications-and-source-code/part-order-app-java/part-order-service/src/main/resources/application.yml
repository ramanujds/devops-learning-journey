spring:
  profiles:
    active: dev
  application:
    name: part-order-service
  cloud:
    openfeign:
      micrometer:
        # explicit (this is Spring Cloud OpenFeign's default when Micrometer
        # is on the classpath): wraps every InventoryServiceClient call in a
        # client-side span and injects the W3C traceparent header, so the
        # order-service -> inventory-service call joins the same trace.
        enabled: true

#feign:
#  client:
#    config:
#      inventory-service:
#        url: ${INVENTORY_SERVICE_URL:http://localhost:8081}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  otlp:
    metrics:
      export:
        # spring-boot-starter-opentelemetry also auto-configures an OTLP metrics
        # exporter; this app only wants OTLP for traces (metrics are scraped via
        # Prometheus elsewhere, see k8s-cluster-monitoring-logging/), so this is
        # off to avoid periodic connection-refused stack traces when no
        # collector is listening for metrics too.
        enabled: false
  tracing:
    sampling:
      # trace every request by default (dev/learning scope); dial this down
      # in a real prod environment to control span volume/cost.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # OTLP/HTTP endpoint spans are exported to. Defaults to a collector
          # running on localhost (e.g. via `mvnw spring-boot:run`); in
          # Kubernetes this is overridden to the otel-collector Service, see
          # k8s-with-tracing/README.md.
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
