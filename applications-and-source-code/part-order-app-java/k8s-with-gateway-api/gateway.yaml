apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: parts-gateway
  namespace: part-order-app-gateway
spec:
  # GKE's built-in GatewayClass for a global external Application Load
  # Balancer - the Gateway API analog of ingressClassName: gce in
  # ../k8s-with-ingress. Other GKE classes: gke-l7-regional-external-managed,
  # gke-l7-rilb (regional internal), gke-l7-gxlb (classic, legacy).
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    # Plain HTTP listener - kept only so http://<ip>/ can 301 to https
    # instead of just timing out. See httproute.yaml's parts-redirect-route,
    # which is the only HTTPRoute attached to this listener (via
    # parentRefs[].sectionName: http) - it carries no app traffic itself.
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        # Only HTTPRoutes in this same namespace may attach to this Gateway.
        # (The alternative, "All", is how you'd let routes in other
        # namespaces share one Gateway/LB - not needed here since this stack
        # is self-contained in one namespace.)
        namespaces:
          from: Same
    # TLS termination happens here: the load balancer decrypts with this
    # cert, then forwards plain HTTP to the backend Pods - the Pods
    # themselves never see TLS (same "edge termination" model as
    # terminating TLS at an Ingress or a reverse proxy). certificateRefs
    # points at a kubernetes.io/tls Secret; see NOTES.md "TLS termination"
    # for how to generate one (self-signed, no real domain required).
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: parts-tls-cert
      allowedRoutes:
        namespaces:
          from: Same
