# Default values for part-order-app.
#
# These defaults describe the dev/H2 stack (equivalent to ../../k8s/).
# Use -f values-dev.yaml or -f values-prod.yaml to select an environment
# explicitly; see values-prod.yaml for the MySQL-backed alternative
# (equivalent to ../../k8s-with-mysql/).

nameOverride: ""
fullnameOverride: ""

image:
  # shared pull policy for both app images; mysql has its own (below)
  pullPolicy: Always

# spring profile shared by both services:
#   dev  -> H2 in-memory DB, per-pod, schema.sql/data.sql run on every boot
#   prod -> MySQL, ddl-auto: update, no seed data (requires mysql.enabled: true)
springProfile: dev

partInventoryService:
  image:
    repository: ram1uj/part-inventory-service
    tag: latest
  # single replica: dev profile uses per-pod H2, so state isn't shared across
  # replicas. values-prod.yaml bumps this once MySQL is wired up.
  replicaCount: 1
  service:
    # internal only - part-order-service is the only consumer
    type: ClusterIP
    port: 8080
    nodePort: null
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  readinessProbe:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3

partOrderService:
  image:
    repository: ram1uj/part-order-service
    tag: latest
  replicaCount: 1
  service:
    # NodePort so the web UI is reachable from outside the cluster in a
    # local dev cluster (minikube/kind/Docker Desktop)
    type: NodePort
    port: 8080
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  readinessProbe:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3

# MySQL is only deployed/used when springProfile: prod. See values-prod.yaml.
mysql:
  enabled: false
  image: mysql:8.0
  imagePullPolicy: IfNotPresent

  # Name of a pre-existing Secret with the same keys as `auth` below
  # (MYSQL_ROOT_PASSWORD, INVENTORY_DB_PASSWORD, ORDER_DB_PASSWORD).
  # Leave empty to have the chart generate one from `auth`.
  existingSecret: ""

  # Plaintext dev-safe placeholders only. For a real environment, override
  # via --set or a values file generated by a secret manager (Sealed
  # Secrets, External Secrets, Vault, etc.) - never commit real credentials.
  auth:
    rootPassword: dev-root-pw
    inventoryDbPassword: dev-inventory-pw
    orderDbPassword: dev-order-pw

  inventoryDatabase: part_inventory_db
  orderDatabase: part_order_db
  inventoryUser: inventory_app
  orderUser: order_app

  persistence:
    size: 2Gi
    storageClassName: ""

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    initialDelaySeconds: 40
    periodSeconds: 20
    timeoutSeconds: 5
