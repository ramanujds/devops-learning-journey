apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: part-order-app-tracing
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}

    exporters:
      # prints every received span to this Pod's own stdout — useful to confirm
      # spans are arriving even before Tempo/Grafana are wired up
      debug:
        verbosity: basic
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp/tempo]
