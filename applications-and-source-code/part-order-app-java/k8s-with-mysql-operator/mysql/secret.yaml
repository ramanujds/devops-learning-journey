# Plaintext for local/dev use only. For a real environment, generate these
# with a secret manager (Sealed Secrets, External Secrets, Vault, etc.)
# instead of committing credentials to git.
#
# Two secrets, two purposes:
#   mycluster-creds  - the exact rootUser/rootHost/rootPassword shape the
#                       MySQL Operator requires via InnoDBCluster.spec.secretName
#   mysql-app-secret - the two scoped app-user passwords, same idea as
#                       ../../k8s-with-mysql/mysql/secret.yaml's
#                       INVENTORY_DB_PASSWORD/ORDER_DB_PASSWORD, just not
#                       bundled with the root password this time
apiVersion: v1
kind: Secret
metadata:
  name: mycluster-creds
  namespace: part-order-app-mysql-operator
type: Opaque
stringData:
  rootUser: root
  rootHost: "%"
  rootPassword: dev-root-pw
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-app-secret
  namespace: part-order-app-mysql-operator
type: Opaque
stringData:
  INVENTORY_DB_PASSWORD: dev-inventory-pw
  ORDER_DB_PASSWORD: dev-order-pw
