# The Operator only manages the root account (mycluster-creds) - it has no
# idea this app needs its own databases/users. Same job
# ../../k8s-with-mysql/mysql/init-configmap.yaml did via
# /docker-entrypoint-initdb.d, but there's no equivalent hook on an
# InnoDBCluster, so this runs as a one-shot Job against the Router instead.
#
# CREATE ... IF NOT EXISTS makes this safe to re-run (e.g. after a failed
# attempt while the cluster was still coming online).
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init-users
  namespace: part-order-app-mysql-operator
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-router
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mycluster 6446; do echo waiting for mycluster router; sleep 5; done
      containers:
        - name: init-users
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              mysql -h mycluster -P 6446 -uroot -p"${MYSQL_ROOT_PASSWORD}" <<-EOSQL
                  CREATE DATABASE IF NOT EXISTS part_inventory_db;
                  CREATE DATABASE IF NOT EXISTS part_order_db;

                  CREATE USER IF NOT EXISTS 'inventory_app'@'%' IDENTIFIED BY '${INVENTORY_DB_PASSWORD}';
                  GRANT ALL PRIVILEGES ON part_inventory_db.* TO 'inventory_app'@'%';

                  CREATE USER IF NOT EXISTS 'order_app'@'%' IDENTIFIED BY '${ORDER_DB_PASSWORD}';
                  GRANT ALL PRIVILEGES ON part_order_db.* TO 'order_app'@'%';

                  FLUSH PRIVILEGES;
              EOSQL
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mycluster-creds
                  key: rootPassword
          envFrom:
            - secretRef:
                name: mysql-app-secret
