apiVersion: v1
kind: ConfigMap
metadata:
  name: part-inventory-service-config
  namespace: part-order-app-mysql-operator
data:
  # prod profile -> MySQL via application-prod.yml (ddl-auto: update, so
  # Hibernate creates the schema on first boot; sql.init.mode is "never" so
  # schema.sql/data.sql do NOT run - the DB starts empty, unlike the dev/H2 stack)
  SPRING_PROFILES_ACTIVE: "prod"
  # mycluster is the Router Service the Operator creates (see
  # ../mysql/innodbcluster.yaml) - NOT a MySQL Pod directly. 6446 is the
  # Router's read-write port; it always forwards to whichever instance is
  # currently primary, even after a failover.
  MYSQL_HOST: "mycluster"
  MYSQL_PORT: "6446"
  MYSQL_DATABASE: "part_inventory_db"
  MYSQL_USER: "inventory_app"
