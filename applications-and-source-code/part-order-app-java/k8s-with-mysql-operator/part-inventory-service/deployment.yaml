apiVersion: apps/v1
kind: Deployment
metadata:
  name: part-inventory-service
  namespace: part-order-app-mysql-operator
  labels:
    app: part-inventory-service
spec:
  # state lives in the InnoDB Cluster, not per-pod, so this can safely run
  # >1 replica (unlike the dev/H2 stack in ../../k8s)
  replicas: 2
  selector:
    matchLabels:
      app: part-inventory-service
  template:
    metadata:
      labels:
        app: part-inventory-service
    spec:
      initContainers:
        # waits on the Router Service, not a mysql Pod - the Router is only
        # up once the Operator has bootstrapped Group Replication between
        # the InnoDBCluster's instances
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mycluster 6446; do echo waiting for mycluster router; sleep 2; done
      containers:
        - name: part-inventory-service
          image: ram1uj/part-inventory-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: part-inventory-service-config
          env:
            # pulled individually (not envFrom the whole secret) so the app
            # pod never sees the order service's password or the cluster
            # root password (that one lives in mycluster-creds, untouched
            # by any app Deployment)
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-app-secret
                  key: INVENTORY_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
