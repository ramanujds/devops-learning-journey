apiVersion: v1
kind: Service
metadata:
  name: part-order-service
  namespace: part-order-app-mysql-operator
  labels:
    app: part-order-service
spec:
  # NodePort so the web UI (home/place-order/orders) is reachable from
  # outside the cluster in a local dev cluster (minikube/kind/Docker Desktop).
  # NodePort is 30082, distinct from ../../k8s (30080) and
  # ../../k8s-with-mysql (30081) so all three stacks can be applied at once.
  type: NodePort
  selector:
    app: part-order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30082
