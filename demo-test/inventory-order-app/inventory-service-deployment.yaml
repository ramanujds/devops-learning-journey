apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-deployment
spec:
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service-container
          image: ram1uj/part-inventory-service:v2
          ports:
            - name: http
              containerPort: 8080

          env:
            - name: MYSQL_HOST
              value: mysql-service
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                  secretKeyRef:
                    name: application-secret
                    key: MYSQL_DB
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
