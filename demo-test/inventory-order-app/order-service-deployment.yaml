apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
       - name: order-service-container
         image: ram1uj/part-order-service
         ports:
          - containerPort: 8080
         env:
          - name: INVENTORY_SERVICE_URL
            value: "http://inventory-service"
          
         resources:
            requests:
              cpu: 100m
              memory: 400Mi
            limits:
              cpu: 500m
              memory: 600Mi


